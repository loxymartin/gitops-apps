apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mts
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/loxymartin/gitops-apps.git"
    targetRevision: HEAD
    path: mts
  destination:
    server: "https://kubernetes.default.svc"
    namespace: mts
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
