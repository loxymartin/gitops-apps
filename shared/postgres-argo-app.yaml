apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shared-postgres
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/loxymartin/gitops-apps.git"
    targetRevision: HEAD
    path: shared/postgres
  destination:
    server: "https://kubernetes.default.svc"
    namespace: shared
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
